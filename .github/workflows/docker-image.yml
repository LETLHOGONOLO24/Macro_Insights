name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          echo "Logging into Docker Hub as: ${{ secrets.DOCKERHUB_USERNAME }}"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          echo "Building image..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/macro-insights:latest .

      - name: Verify image built locally
        run: |
          echo "Listing local Docker images:"
          docker images

      - name: Push Docker image
        run: |
          echo "Pushing to Docker Hub..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/macro-insights:latest


